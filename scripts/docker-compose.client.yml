# Client deployment — pre-built images only (no source code required).
# Project name "restapos" keeps containers unique across apps on the same Docker host.
# SQL is NOT included — use shared-sqlserver (docker-compose.shared-sql.yml) once per host.
#
# From repo: docker compose -f scripts/docker-compose.client.yml -p restapos --project-directory scripts up -d
# Load images first: .\scripts\import-docker-images.ps1

name: restapos

services:
  resta-api:
    image: restapos/api:${RESTAPOS_VERSION:-latest}
    container_name: restapos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
      Jwt__Key: ${JWT_KEY:-RestaPos_Docker_SigningKey_Min32Chars!}
      Jwt__Issuer: ${JWT_ISSUER:-CustomerApi}
      Jwt__Audience: ${JWT_AUDIENCE:-SystemService}
    ports:
      - "${API_PORT:-8081}:8080"
    # Connects to shared SQL via ConnectionStrings__DefaultConnection (not a local sqlserver service).
    restart: unless-stopped

  resta-app:
    image: restapos/web:${RESTAPOS_VERSION:-latest}
    container_name: restapos-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - resta-api
    restart: unless-stopped
